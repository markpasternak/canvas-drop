packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  better-sqlite3: true
  esbuild: true
# Force transitive dependencies past known advisories. Each entry is here because
# the vulnerable package has no direct dependent we control — it arrives under a
# third-party tree (vite/vitest, jsdom, sanitize-html, the MCP SDK), so bumping our
# own package.json ranges cannot reach it. Direct dependencies are fixed by raising
# their range in package.json instead, never here.
#
# esbuild   GHSA-67mh-4wv8-2f99 (<=0.24.2, via drizzle-kit's @esbuild-kit loader)
#           GHSA-g7r4-m6w7-qqqr (>=0.27.3 <0.28.1, via vitest -> vite)
# postcss   GHSA-fxqj-rqcc-2cmp  (<=8.5.22, via vite and sanitize-html)
# nanoid    GHSA-2v37-7h3g-55p8  (<3.3.17, via postcss)
# undici    GHSA-4cwx-7wf7-3272, GHSA-8xcm-r25x-g524, GHSA-m8rv-5g2x-5cg5,
#           GHSA-jr45-8vmc-qm54, GHSA-v3r7-h72x-cjcm, plus the 2026-10 batch
#           (WebSocket/decompression DoS, BalancedPool TLS bypass, Set-Cookie
#           caching) (<7.29.1, via jsdom)
# dompurify GHSA-55q2-fjhq-7xh7 and the IN_PLACE advisories (<=3.4.15, via mermaid)
# fast-uri  GHSA-7p8r-x3mc-p8w7, GHSA-v2hh-gcrm-f6hx, plus host-confusion / SSRF /
#           authority-injection fixes (<3.1.8, via ajv <- MCP SDK)
# ip-address GHSA-mwp4-54f8-5fhr, GHSA-4xrf-jv44-h6hh, GHSA-22jq-vg5j-6vgg, plus
#           link-local / NAT64 / cross-family subnet fixes (<10.7.1, via
#           express-rate-limit <- MCP SDK)
# hono      GHSA-8j4g-w8fx-2239, GHSA-f23p-vx2j-j53r, GHSA-79qm-7rj5-m7r9,
#           GHSA-54fx-42gc-7vw4, plus parseBody nesting, query-after-fragment,
#           toSSG and jsx boundary fixes (<4.13.13, via @hono/mcp and the MCP SDK)
# proxy-addr IPv4-mapped IPv6 trust-subnet spoofing (<2.0.8, via express <- MCP SDK;
#           canvas-drop never mounts express, so defence in depth)
# qs        arrayLimit bypass + isBuffer DoS (<6.16.0, via express <- MCP SDK)
# source-map-js event-loop DoS via indexed section offsets (<1.2.2, via postcss)
# fast-copy stack exhaustion on deep values (<4.1.0, via pino-pretty)
#
# Not overridden: katex <0.18.2 (low; via mermaid, which pins ^0.16 — the fix is a
# 0.x minor and would cross a breaking line inside the bundled docs renderer).
# @hono/node-server GHSA-frvp-7c67-39w9 (1.x <1.19.15, via the MCP SDK; our own
#           direct dependency is on the 2.x line, raised in apps/server/package.json)
#
# Every matcher is bounded at BOTH ends, always to the major the fix landed in.
# An open-ended `pkg@<X` also matches every earlier major, so a future transitive
# dep on (say) postcss ^7 would be force-resolved to 8 and break on the APIs that
# major removed — a bounded matcher leaves it alone instead.
overrides:
  "esbuild@<=0.24.2": "^0.25.12"
  "esbuild@>=0.27.3 <0.28.1": "^0.28.1"
  "postcss@>=8.0.0 <8.5.23": "^8.5.23"
  "nanoid@>=3.0.0 <3.3.17": "^3.3.17"
  "undici@>=7.0.0 <7.29.1": "^7.29.1"
  "dompurify@>=3.0.0 <3.4.16": "^3.4.16"
  "fast-uri@>=3.0.0 <3.1.8": "^3.1.8"
  "ip-address@>=10.0.0 <10.7.1": "^10.7.1"
  "hono@>=4.0.0 <4.13.13": "^4.13.13"
  "@hono/node-server@>=1.0.0 <1.19.15": "^1.19.15"
  "proxy-addr@>=2.0.0 <2.0.8": "^2.0.8"
  "qs@>=6.0.0 <6.16.0": "^6.16.0"
  "source-map-js@>=1.0.0 <1.2.2": "^1.2.2"
  "fast-copy@>=4.0.0 <4.1.0": "^4.1.0"
