name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PNPM_VERSION: 11.0.9
  NODE_VERSION: 24

jobs:
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Docs compile to a committed module (apps/server/src/docs/generated-content.ts).
      # Re-run the build and fail if it drifts from what's checked in.
      - run: pnpm docs:build
      - name: Assert generated docs are up to date
        run: git diff --exit-code -- apps/server/src/docs/generated-content.ts
      # The Mermaid renderer served at /docs/mermaid.js is a committed esbuild
      # bundle, so a dependency bump does NOT reach visitors until it is rebuilt.
      # It went stale exactly that way once: the tree carried DOMPurify 3.4.11
      # (GHSA-55q2-fjhq-7xh7) for a bump that had already closed the advisory in
      # the lockfile. Same esbuild + same lockfile is byte-reproducible, so drift
      # here means someone changed a dep without rebuilding.
      - run: pnpm docs:mermaid
      - name: Assert the bundled Mermaid renderer is up to date
        run: git diff --exit-code -- docs/site/assets/mermaid.js
      - run: pnpm lint
      - run: pnpm typecheck

  # SQLite leg: the full suite runs both dialects in-process (sqlite + pglite),
  # so this already exercises Postgres dialect SQL. CANVAS_DROP_DB=sqlite drives
  # the test:sqlite script path. No services needed.
  test-sqlite:
    name: Test (sqlite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:sqlite

  # Dashboard leg: the React/jsdom suite. Dialect-agnostic, so it runs ONCE here
  # rather than under both DB legs. Typecheck + build are covered by the lint and
  # build jobs (root `typecheck`/`build` include the dashboard).
  test-dashboard:
    name: Test (dashboard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:dashboard

  # Postgres leg: same suite, plus real-infrastructure smoke tests against a live
  # postgres:16 (node-postgres driver) and MinIO (real S3Driver) — coverage the
  # in-process drivers can't give.
  test-postgres:
    name: Test (postgres + real infra)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: canvasdrop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CANVAS_DROP_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/canvasdrop_test
      CANVAS_DROP_TEST_S3_ENDPOINT: http://localhost:8333
      CANVAS_DROP_TEST_S3_BUCKET: canvas-drop-test
      CANVAS_DROP_TEST_S3_REGION: us-east-1
      CANVAS_DROP_TEST_S3_ACCESS_KEY: canvasdrop
      CANVAS_DROP_TEST_S3_SECRET_KEY: canvasdrop-demo-only-secret
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # SeaweedFS is the S3-compatible endpoint the real-infra tests run against (the
      # MinIO community images were withdrawn from Docker Hub in 2025). It runs as a
      # step (not a service) because it needs a `server -s3` command, which service
      # containers can't override; one container hosts master + volume + filer + the
      # S3 gateway on :8333, with the same demo credentials the compose profile uses.
      - name: Start SeaweedFS and create the test bucket
        run: |
          docker run -d --name seaweedfs -p 8333:8333 \
            -v "$PWD/docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:4.46 \
            server -s3 -dir=/data -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=1024 -ip.bind=0.0.0.0
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:8333/; then echo "seaweedfs up"; break; fi
            sleep 2
          done
          # The gateway answers before the volume server has registered; retry the bucket.
          for i in $(seq 1 15); do
            if aws --endpoint-url http://localhost:8333 s3 mb s3://canvas-drop-test; then break; fi
            sleep 2
          done
          aws --endpoint-url http://localhost:8333 s3 ls
        env:
          AWS_ACCESS_KEY_ID: canvasdrop
          AWS_SECRET_ACCESS_KEY: canvasdrop-demo-only-secret
          AWS_DEFAULT_REGION: us-east-1

      - run: pnpm install --frozen-lockfile
      - run: pnpm test:pg

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  dependency-audit:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Advisory only — surfaces findings in the log without blocking the run.
      # (Current finding: esbuild, a dev-only transitive of drizzle-kit; the
      # advisory is Deno-specific and does not affect our Node usage.)
      - run: pnpm audit --audit-level high || true
