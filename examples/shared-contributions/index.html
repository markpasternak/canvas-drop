<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shared feedback</title>
  <script src="/sdk/v1.js"></script>
  <style>
    body { margin: 3rem auto; padding: 0 1rem; max-width: 44rem; font: 17px/1.5 system-ui,sans-serif; color: #172335; background: #fafaf7; }
    input,textarea,button,select { font: inherit; max-width: 100%; padding: .5rem; box-sizing: border-box; }
    textarea { width: 100%; min-height: 6rem; } label { display: block; margin: .8rem 0; }
    button { cursor: pointer; } article { border-top: 1px solid #ccd3dc; padding: 1rem 0; overflow-wrap: anywhere; }
    .actions { display:flex; flex-wrap:wrap; align-items:center; gap:.7rem; } small { color:#526070; }
    a { color: #145da0; } #status { min-height: 1.5rem; }
  </style>
</head>
<body>
  <h1>Shared feedback</h1>
  <p>Everyone can contribute. Authors and canvas owners/editors can change a comment's status or delete it.</p>
  <p id="identity">Loading your access…</p>
  <p id="status" role="status" aria-live="polite"></p>
  <main id="app" hidden>
    <form id="form">
      <label>Your comment<textarea id="text" maxlength="8000" required></textarea></label>
      <label>Attachment (optional)<input id="file" type="file"></label>
      <button id="submit" type="submit">Add comment</button>
    </form>
    <p><button id="export" type="button">Export visible comments</button> <button id="refresh" type="button">Refresh</button></p>
    <section id="comments" aria-label="Comments"></section>
  </main>
  <script type="module">
    const $ = id => document.getElementById(id);
    const cd = canvasdrop;
    const comments = cd.kv.collection("comments");
    const activity = cd.realtime.channel("activity");
    let me, rights, rows = [], busy = false, loadGeneration = 0;
    const may = (operation, row) => rights[operation].any || (rights[operation].own && row.authorId === me.id);
    async function load() {
      const generation = ++loadGeneration;
      const next = []; let cursor;
      do { const page = await comments.list({ limit: 100, cursor }); next.push(...page.entries); cursor = page.nextCursor ?? undefined; } while (cursor);
      const nextRights = await comments.permissions();
      if (generation !== loadGeneration) return next;
      rows = next;
      rights = nextRights;
      $("comments").replaceChildren();
      for (const row of rows) {
        const article = document.createElement("article");
        const text = document.createElement("p"); text.textContent = row.value.text; article.append(text);
        const author = document.createElement("small"); author.textContent = row.authorId === me.id ? "Your comment" : `Author: ${row.authorId}`; article.append(author);
        if (row.value.fileId) { const p = document.createElement("p"), link = document.createElement("a"); link.href = cd.files.url(row.value.fileId); link.textContent = row.value.fileName || "Download attachment"; p.append(link); article.append(p); }
        const actions = document.createElement("div"); actions.className = "actions";
        const label = document.createElement("label"); label.textContent = "Status ";
        const select = document.createElement("select"); select.setAttribute("aria-label", `Status: ${row.value.text}`);
        for (const [value, name] of [["open", "Open"], ["fixed", "Fixed"], ["wont-fix", "Won’t fix"]]) { const option = document.createElement("option"); option.value = value; option.textContent = name; select.append(option); }
        select.value = row.value.status; select.disabled = !may("update", row);
        select.addEventListener("change", () => run(async () => { await comments.update(row.id, { ...row.value, status: select.value }); })); label.append(select); actions.append(label);
        if (may("delete", row)) { const remove = document.createElement("button"); remove.textContent = "Delete comment"; remove.addEventListener("click", () => run(() => comments.delete(row.id))); actions.append(remove); }
        article.append(actions); $("comments").append(article);
      }
      if (!rows.length) $("comments").textContent = "No comments yet.";
      return next;
    }
    async function run(action) {
      if (busy) return;
      busy = true; $("submit").disabled = true;
      try { await action(); await load(); activity.publish("changed", {}); $("status").textContent = "Saved."; }
      catch (error) { $("status").textContent = error.code === "PERMISSION_DENIED" ? "Your access changed. Refresh to update the controls." : error.message; }
      finally { busy = false; $("submit").disabled = !rights?.create.any; }
    }
    $("form").addEventListener("submit", event => { event.preventDefault(); run(async () => {
      const row = await comments.create({ text: $("text").value, status: "open" });
      const file = $("file").files[0];
      if (file) { const uploaded = await cd.files.upload(file, { collection: "comments", recordId: row.id }); await comments.update(row.id, { ...row.value, fileId: uploaded.id, fileName: uploaded.name }); }
      $("form").reset();
    }); });
    $("refresh").addEventListener("click", () => load().catch(error => { $("status").textContent = error.message; }));
    $("export").addEventListener("click", async () => {
      try { const visible = await load(); const blob = new Blob([JSON.stringify(visible, null, 2)], { type: "application/json" }); const url = URL.createObjectURL(blob); const link = document.createElement("a"); link.href = url; link.download = "comments.json"; link.click(); setTimeout(() => URL.revokeObjectURL(url), 1000); }
      catch (error) { $("status").textContent = error.message; }
    });
    try {
      me = await cd.me(); rights = await comments.permissions();
      $("identity").textContent = `${me.name} · ${me.canvasRole}`; $("submit").disabled = !rights.create.any;
      await load(); $("app").hidden = false;
      activity.onError(error => { $("status").textContent = `Live updates: ${error.message}`; });
      activity.subscribe(() => load().catch(error => { $("status").textContent = error.message; }));
    } catch (error) { $("status").textContent = error.code === "NOT_FOUND" || error.code === "COLLECTION_NOT_CONFIGURED" ? "Configure the comments collection with Shared contributions in Backend settings, and add an activity channel using Participation." : error.message; }
  </script>
</body>
</html>
